<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Languages around the Globe</title>
    <style>
        .container {
            display: flex;
            justify-content: space-between;
            align-items: flex-start; /* Align items at the top */
            margin-top: 0; /* Remove top margin */
        }
        .vis-container {
            flex: 2; /* Take up 2/3 of the space */
            margin-right: 20px; /* Space between the visualization and the text */
            margin-top: 0; /* Remove top margin */
        }
        .text-container {
            flex: 1; /* Take up 1/3 of the space */
            font-family: 'Helvetica', sans-serif;
            font-weight: bold; /* Make the text bold */
            margin-top: 0; /* Ensure no top margin */
        }
        .vega-bindings {
            display: flex; /* Apply flexbox to the dropdown */
            justify-content: center; /* Center the dropdown horizontally */
            margin: 0; /* Remove all margins */
            font-family: 'Helvetica', sans-serif;
            font-weight: bold; /* Make the text bold */
        }
        h1 {
            text-align: center; /* Center the title horizontally */
            margin: 0; /* Remove all margins */
            padding: 10px 0; /* Add some padding for spacing */
            font-family: 'Helvetica', sans-serif;
            font-weight: bold; /* Make the text bold */
        }
        body {
            background-color: lightblue; /* Change this to any color you like */
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-lite@5"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>
</head>
<body>
    <h1>Languages around the Globe</h1> <!-- This title appears on the webpage -->
    <div class="vega-bindings"></div> <!-- This will hold the dropdown -->
    <div class="container">
        <div id="vis" class="vis-container"></div>
        <div class="text-container">
            <p>Languages vary greatly across the globe, each having their own dialects, accents and even sub.</p>
        </div>
    </div>
    <script type="text/javascript">

        const spec = {
                "$schema": "https://vega.github.io/schema/vega-lite/v5.json",
                "background": "lightblue",
                "params": [
                    {
                    "name": "languageselect",
                    "value": "English",
                    "bind": {
                        "input": "select",
                        "options": [
                        "English",
                        "Mandarin",
                        "Hindi",
                        "Spanish",
                        "Arabic",
                        "French",
                        "Bengali",
                        "Portuguese",
                        "Russian",
                        "Urdu"
                        ],
                        "name": "Official Language "
                    }
                    },
                    {
                        "name": "languageColor",
                        "value": {
                            "English": "#1f77b4",  // Blue
                            "Mandarin": "#d62728",  // Red
                            "Hindi": "#ff9933",  // Saffron
                            "Spanish": "#ffcc00",  // Yellow
                            "Arabic": "#228B22",  // Green
                            "French": "#000080",  // Navy Blue
                            "Bengali": "#32CD32",  // Lime Green
                            "Portuguese": "#006400",  // Dark Green
                            "Russian": "#DC143C",  // Crimson
                            "Urdu": "#556B2F"   // Dark Olive Green
                        }
                    }
                ],
                "vconcat": [
                    {
                    "width": 1000,
                    "height": 450,
                    "layer": [
                        {
                        "projection": {"type": "equirectangular", "rotate": [-162, 0, 0]},
                        "data": {
                            "url": "https://raw.githubusercontent.com/mboribon/assign2/refs/heads/main/ne_50m_admin_0_countries.json",
                            "format": {
                            "type": "topojson",
                            "feature": "ne_50m_admin_0_countries"
                            }
                        },
                        "transform": [
                            {
                            "lookup": "properties.ADMIN",
                            "from": {
                                "data": {
                                "url": "https://raw.githubusercontent.com/mboribon/assign2/refs/heads/main/Official%20Languages_1.csv"
                                },
                                "key": "Country",
                                "fields": ["Officiallanguage"]
                            }
                            }
                        ],
                        "mark": {"type": "geoshape", "fill": "white", "stroke": "lightgrey"},
                        "encoding": {
                            "fill": {"type": "nominal"},
                            "tooltip": [
                            {
                                "field": "properties.ADMIN",
                                "type": "nominal",
                                "title": "Country"
                            },
                            {"field": "Officiallanguage", "type": "nominal"}
                            ]
                        }
                        },
                        {
                        "mark": {"type": "geoshape", "stroke": "lightgrey"},
                        "encoding": {
                            "fill": {
                            "field": "Officiallanguage",
                            "type": "nominal",
                            "scale": {
                                "domain": [
                                    "English",
                                    "Mandarin",
                                    "Hindi",
                                    "Spanish",
                                    "Arabic",
                                    "French",
                                    "Bengali",
                                    "Portuguese",
                                    "Russian",
                                    "Urdu"
                                ],
                                "range": [
                                    "#1f77b4",  // English: Blue
                                    "#d62728",  // Mandarin: Red
                                    "#ff9933",  // Hindi: Saffron
                                    "#ffcc00",  // Spanish: Yellow
                                    "#228B22",  // Arabic: Green
                                    "#000080",  // French: Navy Blue
                                    "#32CD32",  // Bengali: Lime Green
                                    "#006400",  // Portuguese: Dark Green
                                    "#DC143C",  // Russian: Crimson
                                    "#556B2F"   // Urdu: Dark Olive Green
                                ]
                            },
                            "legend": {
                                "title": "Official Language",
                                "orient": "none",   
                                "legendX": 1000,
                                "legendY": 0
                                }
                            }
                        }
                        },
                        {
                        "data": {
                            "url": "https://raw.githubusercontent.com/FIT3179/Vega-Lite/main/7_others/oceans.topojson",
                            "format": {"type": "topojson", "feature": "oceans"}
                        },
                        "mark": {"type": "geoshape", "fill": "skyblue"}
                        },
                        {
                        "data": {
                            "url": "https://raw.githubusercontent.com/FIT3179/Vega-Lite/main/2_symbol_map/js/WorldMapWithGraticules.topojson",
                            "format": {"type": "topojson", "feature": "ne_110m_graticules_30"}
                        },
                        "mark": {"type": "geoshape", "fill": "null", "stroke": "white"}
                        },
                        {
                        "data": {
                            "url": "https://raw.githubusercontent.com/mboribon/assign2/refs/heads/main/ne_50m_admin_0_countries.json",
                            "format": {
                            "type": "topojson",
                            "feature": "ne_50m_admin_0_countries"
                            }
                        },
                        "transform": [
                            {
                            "lookup": "properties.ADMIN",
                            "from": {
                                "data": {
                                "url": "https://raw.githubusercontent.com/mboribon/assign2/refs/heads/main/Official%20Languages_1.csv"
                                },
                                "key": "Country",
                                "fields": ["Officiallanguage", "Count"]
                            }
                            },
                            {"filter": "datum.Officiallanguage == languageselect"}
                        ],
                        "mark": {"type": "geoshape", "fill": "white", "stroke": "lightgrey"},
                        "encoding": {
                            "fill": {
                            "type": "nominal",
                            "condition": {
                                "param": "languageselect",
                                "value": {"signal": "languageColor[languageselect]"}
                            }
                            },
                            "tooltip": [
                            {
                                "field": "properties.ADMIN",
                                "type": "nominal",
                                "title": "Country"
                            },
                            {
                                "field": "Officiallanguage",
                                "type": "nominal",
                                "title": "Official Language"
                            }
                            ]
                        }
                        },
                        {
                        "data": {
                            "url": "https://raw.githubusercontent.com/mboribon/assign2/refs/heads/main/ne_50m_admin_0_countries.json",
                            "format": {
                            "type": "topojson",
                            "feature": "ne_50m_admin_0_countries"
                            }
                        },
                        "transform": [
                            {
                            "lookup": "properties.ADMIN",
                            "from": {
                                "data": {
                                "url": "https://raw.githubusercontent.com/mboribon/assign2/refs/heads/main/Official%20Languages_1.csv"
                                },
                                "key": "Country",
                                "fields": ["Officiallanguage", "Count", "lat", "lon"]
                            }
                            },
                            {"filter": "datum.Officiallanguage == languageselect"},
                            {
                            "aggregate": [{"op": "count", "as": "CountryCount"}],
                            "groupby": ["Officiallanguage", "lon", "lat"]
                            },
                            {
                            "window": [{"op": "rank", "as": "ranking"}],
                            "sort": [{"field": "CountryCount", "order": "descending"}]
                            },
                            {
                            "calculate": "'Showing ' + datum['CountryCount']+' countries where; ' + datum['Officiallanguage'] +' is an official language'",
                            "as": "text_annotation_raw"
                            },
                            {
                            "calculate": "split(datum.text_annotation_raw, ';')",
                            "as": "text_annotation"
                            }
                        ],
                        "mark": {"type": "text"},
                        "encoding": {
                            "longitude": {"field": "lon", "type": "quantitative"},
                            "latitude": {"field": "lat", "type": "quantitative"},
                            "text": {"field": "text_annotation", "type": "nominal"},
                            "size": {"value": 15},
                            "color": {"value": "black"}
                        }
                        }
                    ]
                    },
                    {
                    "width": 950,
                    "height": 200,
                    "data": {
                        "url": "https://raw.githubusercontent.com/mboribon/assign2/refs/heads/main/NativeandTotal.csv"
                    },
                    "transform": [
                        {
                        "calculate": "datum['Total-speakers'] / 1000000",
                        "as": "Total-speakers-billions"
                        },
                        {
                        "calculate": "datum['Second-language'] / 1000000",
                        "as": "Second-language-billions"
                        }
                    ],
                    "mark": "circle",
                    "encoding": {
                        "x": {
                        "field": "Language",
                        "type": "nominal",
                        "axis": {"grid": true, "gridColor": "white"}
                        },
                        "y": {
                        "field": "Total-speakers-billions",
                        "type": "quantitative",
                        "scale": {"domain": [0, 1750]},
                        "axis": {"title": "Total Speakers (Millions)", "gridColor": "white"}
                        },
                        "size": {
                        "field": "Second-language-billions",
                        "type": "quantitative",
                        "scale": {"range": [100, 2500]},
                        "legend": {
                            "title": ["Second Language Speakers", "(Millions)"],
                            "orient": "none",
                            "legendX": 1000,
                            "legendY": 470
                        }
                        },
                        "color": {
                        "condition": [
                            {
                            "test": "datum.Language === languageselect",
                            "value": {"signal": "languageColor[languageselect]"}
                            }
                        ],
                        "value": "white"
                        },
                        "tooltip": [
                        {"field": "Language", "type": "nominal"},
                        {
                            "field": "Total-speakers-billions",
                            "type": "quantitative",
                            "title": "Total Speakers (Millions)"
                        },
                        {
                            "field": "Second-language-billions",
                            "type": "quantitative",
                            "title": "Second Language Speakers (Millions) "
                        }
                        ]
                    },
                    "resolve": {"legend": {"size": "independent"}}
                    }
                ],
                "config": {
                    "text": {"font": "Helvetica"},
                    "title": {"font": "Helvetica"},
                    "axis": {"labelFont": "Helvetica", "titleFont": "Helvetica"},
                    "legend": {"labelFont": "Helvetica", "titleFont": "Helvetica"}
                }
                };
        vegaEmbed("#vis", spec, {mode: "vega-lite"}).then(console.log).catch(console.warn);
</script>
</body>
</html>
